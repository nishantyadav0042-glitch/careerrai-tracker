<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    background: #0c0a09;
    font-family: 'Liberation Sans', 'DejaVu Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .stage { position: relative; width: 1024px; height: 500px; overflow: hidden; }

  .blob { position: absolute; border-radius: 50%; filter: blur(110px); }
  .b1 { width: 560px; height: 560px; left: -180px; top: -240px; background: #ea580c; opacity: .38; }
  .b2 { width: 480px; height: 480px; right: -150px; bottom: -250px; background: #14b8a6; opacity: .30; }
  .b3 { width: 360px; height: 360px; right: 280px; top: -200px; background: #7c3aed; opacity: .22; }

  .row {
    position: relative; height: 100%;
    display: flex; align-items: center; gap: 44px;
    padding: 0 62px;
  }

  .logo { width: 316px; height: auto; flex: none; }

  .copy { flex: 1; min-width: 0; }

  .kicker {
    display: inline-flex; align-items: center; gap: 9px;
    font-size: 15px; font-weight: 700; letter-spacing: .13em;
    text-transform: uppercase; color: #fdba74;
    margin-bottom: 16px;
  }
  .kicker .dot { width: 7px; height: 7px; border-radius: 50%; background: #fb923c; }

  h1 {
    font-family: Charter, 'Bitstream Charter', Georgia, 'Liberation Serif', serif;
    font-size: 55px; line-height: 1.06; letter-spacing: -.017em;
    color: #fafaf9; font-weight: 700;
  }
  h1 .accent { color: #fb923c; font-style: italic; }

  .sub {
    margin-top: 18px; font-size: 20px; line-height: 1.45;
    color: #a8a29e; max-width: 520px;
  }

  .chips { margin-top: 24px; display: flex; gap: 10px; }
  .chip {
    font-size: 14.5px; font-weight: 600; color: #e7e5e4;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.13);
    padding: 8px 14px; border-radius: 999px;
  }
  .chip .tick { color: #2dd4bf; font-weight: 800; margin-right: 6px; }
</style>

<div class="stage">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <div class="row">
    <img class="logo" src="LOGO_SRC" alt="CareerRai" />

    <div class="copy">
      <div class="kicker"><span class="dot"></span> CAT 2026 &amp; CAT 2027</div>

      <h1>Know exactly<br />what to study <span class="accent">today.</span></h1>

      <p class="sub">
        A plan built around your real progress — not a generic timetable.
      </p>

      <div class="chips">
        <span class="chip"><span class="tick">✓</span>Free study plan</span>
        <span class="chip"><span class="tick">✓</span>Updates till CAT day</span>
        <span class="chip"><span class="tick">✓</span>Daily Pick</span>
      </div>
    </div>
  </div>
</div>
