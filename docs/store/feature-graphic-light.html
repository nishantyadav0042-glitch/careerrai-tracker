<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    background: #fbfaf8;
    font-family: 'Liberation Sans', 'DejaVu Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .stage { position: relative; width: 1024px; height: 500px; overflow: hidden; }

  /* the same warm blobs the app's own screens use */
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); }
  .b1 { width: 520px; height: 520px; left: -160px; top: -210px; background: #fed7aa; opacity: .75; }
  .b2 { width: 460px; height: 460px; right: -140px; bottom: -220px; background: #99f6e4; opacity: .7; }
  .b3 { width: 340px; height: 340px; right: 300px; top: -180px; background: #ddd6fe; opacity: .5; }

  .row {
    position: relative; height: 100%;
    display: flex; align-items: center; gap: 44px;
    padding: 0 62px;
  }

  .logo { width: 316px; height: auto; flex: none; }

  .copy { flex: 1; min-width: 0; }

  .kicker {
    display: inline-flex; align-items: center; gap: 9px;
    font-size: 15px; font-weight: 700; letter-spacing: .13em;
    text-transform: uppercase; color: #c2410c;
    margin-bottom: 16px;
  }
  .kicker .dot { width: 7px; height: 7px; border-radius: 50%; background: #ea580c; }

  h1 {
    font-family: Charter, 'Bitstream Charter', Georgia, 'Liberation Serif', serif;
    font-size: 55px; line-height: 1.06; letter-spacing: -.017em;
    color: #1c1917; font-weight: 700;
  }
  h1 .accent { color: #ea580c; font-style: italic; }

  .sub {
    margin-top: 18px; font-size: 20px; line-height: 1.45;
    color: #57534e; max-width: 520px;
  }

  .chips { margin-top: 24px; display: flex; gap: 10px; }
  .chip {
    font-size: 14.5px; font-weight: 600; color: #44403c;
    background: rgba(255,255,255,.9); border: 1px solid #e7e5e4;
    padding: 8px 14px; border-radius: 999px;
    box-shadow: 0 1px 2px rgba(28,25,23,.05);
  }
  .chip .tick { color: #0d9488; font-weight: 800; margin-right: 6px; }
</style>

<div class="stage">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <div class="row">
    <img class="logo" src="LOGO_SRC" alt="CareerRai" />

    <div class="copy">
      <div class="kicker"><span class="dot"></span> CAT 2026 &amp; CAT 2027</div>

      <h1>Know exactly<br />what to study <span class="accent">today.</span></h1>

      <p class="sub">
        A plan built around your real progress — not a generic timetable.
      </p>

      <div class="chips">
        <span class="chip"><span class="tick">✓</span>Free study plan</span>
        <span class="chip"><span class="tick">✓</span>Updates till CAT day</span>
        <span class="chip"><span class="tick">✓</span>Daily Pick</span>
      </div>
    </div>
  </div>
</div>
