name: security

# Continuous security scanning — runs on every push to every branch, every PR,
# and weekly, so new CVEs, leaked secrets, and risky code patterns are caught
# before they ship and cannot hide on an unscanned branch. Mirrors
# the one-off audit tooling (Semgrep SAST, Gitleaks secrets, Trivy CVE/secret,
# npm audit) as a standing gate. Tune the failure thresholds to taste.

on:
  pull_request:
  # EVERY BRANCH, not just main (12 Sep 2026). This trigger read
  # `branches: [main]` and that is what let the PR #150 trap below stay open
  # for two weeks after it was documented: a feature branch was scanned ONLY
  # if a `pull_request` event happened to fire for its head commit. Push the
  # commit, open the PR a moment later, and nothing here ran — on a branch
  # that ci.yml was meanwhile reporting green.
  #
  # It is not hypothetical. Two live findings sat unseen behind exactly this
  # gap — one credential, one critical CVE in a dependency. Gitleaks and Trivy
  # would each have named one on the push that introduced it. Neither scan was
  # red; neither scan EXISTED. (Deliberately vague: this repo is PUBLIC, and
  # until the credential is rotated a comment naming what it is and when it
  # landed is a search hint. Details are with the founder, not in git.)
  #
  # `workflow_dispatch` was the 29 Aug answer and it is the wrong shape: a
  # manual button closes nothing, because the failure mode is nobody knowing
  # there is anything to press it for. Matching ci.yml's `'**'` is the fix.
  push:
    branches: ['**']
  schedule:
    - cron: '0 6 * * 1' # weekly, to catch newly-disclosed CVEs in unchanged deps
  # MANUAL RE-RUN, added 29 Aug 2026 — the only workflow here that lacked it.
  #
  # PR #150 is why. Its head commit was pushed to the branch moments before the
  # PR was opened, and no `pull_request` event fired for it: ci.yml ran off the
  # `push` trigger (branches: '**') and reported green, while THIS workflow —
  # which then had no push trigger for feature branches — never ran at all. The
  # PR's checks looked passing because the checks that existed had passed.
  #
  # That is the dangerous shape: not a red scan, an ABSENT one. The push
  # trigger above is what actually closes it; this button remains for the case
  # a dispatch is genuinely wanted — re-running a scan against a newly
  # disclosed advisory without pushing a commit to do it.
  workflow_dispatch: {}

# Scanning every branch means a push and its pull_request event can both fire.
# Supersede rather than pile up — but keep the weekly CVE sweep out of the same
# group, so a routine push to main can never cancel the scheduled scan that
# exists to catch advisories in code nobody touched.
concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependencies:
    name: npm audit (deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      # Fail only on HIGH/CRITICAL production advisories so the known moderate
      # transitive postcss/next advisory doesn't block every PR.
      - run: npm audit --omit=dev --audit-level=high

  sast:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: semgrep ci
        env:
          SEMGREP_RULES: "p/security-audit p/owasp-top-ten p/javascript p/typescript p/nextjs p/secrets"

  secrets:
    name: Gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history so historical leaks are caught too
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  filesystem:
    name: Trivy (CVE + secret + misconfig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Was `aquasecurity/trivy-action@0.28.0`, which stopped resolving —
      # "unable to find version 0.28.0" — so this job failed at its SETUP step
      # and the scan had not actually run for some time. A security check that
      # cannot start is worse than no check: it shows red for a reason nobody
      # reads, and the finding it exists to catch never surfaces at all.
      #
      # Now the official Trivy image, pinned BY DIGEST. A tag can be moved or
      # deleted — which is precisely what broke this — and for the one job
      # whose whole purpose is supply-chain safety, depending on something
      # mutable was the wrong trade. The digest is aquasec/trivy:0.73.0
      # (published 2026-08-03); bump both together.
      - name: Trivy filesystem scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            fs \
              --scanners vuln,secret,misconfig \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --ignore-unfixed \
              --no-progress \
              /repo 
